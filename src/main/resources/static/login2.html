<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <title>河南省交通大数据分析平台 - 用户登录</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" type="text/css" href="https://apps.bdimg.com/libs/bootstrap/3.3.4/css/bootstrap.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <script src="js/jquery.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <style>
        /* 全局样式重置与背景 */
        body, html {
            height: 100%;
            margin: 0;
            padding: 0;
            font-family: "Microsoft YaHei", sans-serif;
            overflow: hidden;
            background: linear-gradient(135deg, #0a1628 0%, #0d2137 50%, #0a1628 100%);
        }

        /* 动态粒子背景容器 */
        #canvas-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* 网格背景 */
        .grid-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(0, 180, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 180, 255, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            z-index: 2;
            pointer-events: none;
        }

        /* 扫描线动画 */
        .scan-line {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: linear-gradient(90deg, transparent, rgba(0, 200, 255, 0.4), transparent);
            animation: scanLine 4s linear infinite;
            z-index: 3;
            pointer-events: none;
        }

        @keyframes scanLine {
            0% { top: 0; opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { top: 100%; opacity: 0; }
        }

        /* 登录框主体容器 */
        .login-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 420px;
            z-index: 10;
            padding: 45px 40px;
            background: rgba(8, 24, 48, 0.85);
            border: 1px solid rgba(0, 180, 255, 0.3);
            border-radius: 8px;
            box-shadow: 
                0 0 40px rgba(0, 150, 255, 0.15),
                inset 0 0 60px rgba(0, 100, 200, 0.05);
            backdrop-filter: blur(10px);
        }

        /* 发光边框动画 */
        .login-container::before {
            content: "";
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            background: linear-gradient(45deg, #00b4ff, #0066cc, #00b4ff, #0066cc);
            background-size: 400% 400%;
            border-radius: 10px;
            z-index: -1;
            animation: glowBorder 3s ease infinite;
            opacity: 0.5;
        }

        @keyframes glowBorder {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        /* 四角装饰 */
        .corner {
            position: absolute;
            width: 25px;
            height: 25px;
            border-color: #00d4ff;
            border-style: solid;
        }
        .corner-tl { top: -1px; left: -1px; border-width: 3px 0 0 3px; border-radius: 8px 0 0 0; }
        .corner-tr { top: -1px; right: -1px; border-width: 3px 3px 0 0; border-radius: 0 8px 0 0; }
        .corner-bl { bottom: -1px; left: -1px; border-width: 0 0 3px 3px; border-radius: 0 0 0 8px; }
        .corner-br { bottom: -1px; right: -1px; border-width: 0 3px 3px 0; border-radius: 0 0 8px 0; }

        /* 标题样式 */
        .header-title {
            text-align: center;
            color: #fff;
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 10px;
            letter-spacing: 3px;
        }

        .header-title i {
            color: #00d4ff;
            margin-right: 10px;
            text-shadow: 0 0 20px rgba(0, 212, 255, 0.8);
        }

        .header-subtitle {
            text-align: center;
            color: rgba(0, 200, 255, 0.6);
            font-size: 12px;
            margin-bottom: 30px;
            letter-spacing: 2px;
        }

        /* Tab 切换 */
        .nav-tabs {
            border-bottom: 1px solid rgba(0, 180, 255, 0.2);
            margin-bottom: 30px;
            display: flex;
            justify-content: center;
        }

        .nav-tabs > li {
            float: none;
            display: inline-block;
        }

        .nav-tabs > li > a {
            color: rgba(255, 255, 255, 0.5);
            background: transparent;
            border: none;
            font-size: 15px;
            padding: 12px 30px;
            transition: all 0.3s;
            position: relative;
        }

        .nav-tabs > li > a::after {
            content: "";
            position: absolute;
            bottom: 0;
            left: 50%;
            width: 0;
            height: 2px;
            background: linear-gradient(90deg, #00b4ff, #00d4ff);
            transition: all 0.3s;
            transform: translateX(-50%);
        }

        .nav-tabs > li > a:hover,
        .nav-tabs > li.active > a {
            color: #fff;
            background: transparent;
            border: none;
        }

        .nav-tabs > li.active > a::after,
        .nav-tabs > li > a:hover::after {
            width: 100%;
        }

        /* 表单输入框样式 */
        .form-group {
            position: relative;
            margin-bottom: 22px;
        }

        .form-control {
            background: rgba(0, 50, 100, 0.3);
            border: 1px solid rgba(0, 180, 255, 0.2);
            color: #fff;
            height: 48px;
            padding-left: 48px;
            border-radius: 6px;
            font-size: 14px;
            transition: all 0.3s;
        }

        .form-control::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        .form-control:focus {
            border-color: #00d4ff;
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.2), inset 0 0 20px rgba(0, 150, 255, 0.1);
            background: rgba(0, 60, 120, 0.4);
            outline: none;
        }

        /* 输入框图标 */
        .input-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #00d4ff;
            font-size: 16px;
            z-index: 2;
            transition: all 0.3s;
        }

        .form-control:focus + .input-icon,
        .form-group:focus-within .input-icon {
            color: #fff;
            text-shadow: 0 0 10px #00d4ff;
        }

        /* 按钮样式 */
        .btn-submit {
            width: 100%;
            height: 48px;
            background: linear-gradient(135deg, #0077b6, #00b4d8);
            border: none;
            color: white;
            font-size: 16px;
            font-weight: 600;
            letter-spacing: 8px;
            margin-top: 15px;
            border-radius: 6px;
            position: relative;
            overflow: hidden;
            transition: all 0.3s;
            cursor: pointer;
        }

        .btn-submit::before {
            content: "";
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s;
        }

        .btn-submit:hover {
            background: linear-gradient(135deg, #00b4d8, #0077b6);
            box-shadow: 0 5px 25px rgba(0, 180, 216, 0.4);
            transform: translateY(-2px);
        }

        .btn-submit:hover::before {
            left: 100%;
        }

        .btn-submit:active {
            transform: translateY(0);
        }

        /* 底部文字 */
        .footer-links {
            margin-top: 20px;
            text-align: center;
            color: rgba(255, 255, 255, 0.4);
            font-size: 12px;
        }

        .footer-links a {
            color: #00d4ff;
            text-decoration: none;
            transition: all 0.3s;
            cursor: pointer;
        }

        .footer-links a:hover {
            color: #fff;
            text-shadow: 0 0 10px #00d4ff;
        }

        /* 装饰元素 - 浮动圆环 */
        .floating-ring {
            position: absolute;
            border: 2px solid rgba(0, 180, 255, 0.1);
            border-radius: 50%;
            pointer-events: none;
            z-index: 4;
        }

        .ring1 {
            width: 300px;
            height: 300px;
            top: 10%;
            left: 5%;
            animation: floatRing 8s ease-in-out infinite;
        }

        .ring2 {
            width: 200px;
            height: 200px;
            bottom: 15%;
            right: 10%;
            animation: floatRing 6s ease-in-out infinite reverse;
        }

        .ring3 {
            width: 150px;
            height: 150px;
            top: 60%;
            left: 8%;
            animation: floatRing 10s ease-in-out infinite;
        }

        @keyframes floatRing {
            0%, 100% { transform: translate(0, 0) rotate(0deg); opacity: 0.3; }
            50% { transform: translate(20px, -20px) rotate(180deg); opacity: 0.6; }
        }

        /* 数据流装饰线 */
        .data-line {
            position: absolute;
            height: 1px;
            background: linear-gradient(90deg, transparent, #00d4ff, transparent);
            z-index: 4;
            pointer-events: none;
        }

        .line1 {
            width: 200px;
            top: 20%;
            right: 0;
            animation: dataFlow 3s linear infinite;
        }

        .line2 {
            width: 150px;
            bottom: 30%;
            left: 0;
            animation: dataFlow 4s linear infinite reverse;
        }

        @keyframes dataFlow {
            0% { opacity: 0; transform: translateX(-50px); }
            50% { opacity: 1; }
            100% { opacity: 0; transform: translateX(50px); }
        }

        /* 隐藏类 */
        .hide {
            display: none;
        }

        /* 版权信息 */
        .copyright {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.3);
            font-size: 12px;
            z-index: 10;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

<canvas id="canvas-bg"></canvas>
<div class="grid-bg"></div>
<div class="scan-line"></div>

<!-- 装饰元素 -->
<div class="floating-ring ring1"></div>
<div class="floating-ring ring2"></div>
<div class="floating-ring ring3"></div>
<div class="data-line line1"></div>
<div class="data-line line2"></div>

<div class="login-container">
    <div class="corner corner-tl"></div>
    <div class="corner corner-tr"></div>
    <div class="corner corner-bl"></div>
    <div class="corner corner-br"></div>

    <div class="header-title">
        <i class="fas fa-satellite-dish"></i>交通大数据平台
    </div>
    <div class="header-subtitle">HENAN TRAFFIC BIG DATA ANALYSIS PLATFORM</div>

    <ul class="nav nav-tabs">
        <li class="active" id="tab-login"><a onclick="switchTab('login')">用户登录</a></li>
        <li id="tab-register"><a onclick="switchTab('register')">账号注册</a></li>
    </ul>

    <form id="login-form">
        <div class="form-group">
            <input type="text" class="form-control" placeholder="请输入用户名">
            <i class="fas fa-user input-icon"></i>
        </div>
        <div class="form-group">
            <input type="password" class="form-control" placeholder="请输入密码">
            <i class="fas fa-lock input-icon"></i>
        </div>
        <button type="button" class="btn btn-submit" onclick="handleLogin()">登 录</button>
        <div class="footer-links">
            <a>忘记密码?</a>
        </div>
    </form>

    <form id="register-form" class="hide">
        <div class="form-group">
            <input type="text" class="form-control" placeholder="设置用户名">
            <i class="fas fa-user input-icon"></i>
        </div>
        <div class="form-group">
            <input type="password" class="form-control" placeholder="设置密码">
            <i class="fas fa-lock input-icon"></i>
        </div>
        <div class="form-group">
            <input type="password" class="form-control" placeholder="确认密码">
            <i class="fas fa-check-circle input-icon"></i>
        </div>
        <button type="button" class="btn btn-submit" onclick="handleRegister()">注 册</button>
        <div class="footer-links">
            注册即代表同意 <a>《平台使用协议》</a>
        </div>
    </form>
</div>

<div class="copyright">© 2025 河南省交通大数据分析平台 All Rights Reserved</div>

<script>
    // 切换登录/注册 Tab
    function switchTab(type) {
        if (type === 'login') {
            $('#tab-login').addClass('active');
            $('#tab-register').removeClass('active');
            $('#login-form').fadeIn(300).removeClass('hide');
            $('#register-form').hide();
        } else {
            $('#tab-register').addClass('active');
            $('#tab-login').removeClass('active');
            $('#register-form').fadeIn(300).removeClass('hide');
            $('#login-form').hide();
        }
    }

    // 真实登录逻辑
    function handleLogin() {
        var username = $('#login-form input[type="text"]').val();
        var password = $('#login-form input[type="password"]').val();

        if(!username || !password) {
            alert("请输入用户名和密码");
            return;
        }

        var $btn = $('#login-form .btn-submit');
        $btn.text('登录中...').css('opacity', '0.7');

        $.ajax({
            url: "/loginAction",
            type: "POST",
            data: {
                username: username,
                password: password
            },
            success: function(res) {
                if (res.success) {
                    window.location.href = 'index.html';
                } else {
                    alert(res.msg);
                    $btn.text('登 录').css('opacity', '1');
                }
            },
            error: function() {
                alert("服务器连接失败");
                $btn.text('登 录').css('opacity', '1');
            }
        });
    }

    // 真实注册逻辑
    function handleRegister() {
        var username = $('#register-form input[type="text"]').eq(0).val();
        var password = $('#register-form input[type="password"]').eq(0).val();
        var confirm  = $('#register-form input[type="password"]').eq(1).val();

        if (password !== confirm) {
            alert("两次密码输入不一致");
            return;
        }

        $.ajax({
            url: "/registerAction",
            type: "POST",
            data: {
                username: username,
                password: password
            },
            success: function(res) {
                alert(res.msg);
                if(res.success) {
                    switchTab('login');
                }
            },
            error: function() {
                alert("注册请求失败");
            }
        });
    }

    // 粒子背景特效
    $(document).ready(function() {
        var canvas = document.getElementById("canvas-bg");
        var ctx = canvas.getContext("2d");
        var w = canvas.width = window.innerWidth;
        var h = canvas.height = window.innerHeight;
        var particles = [];
        var properties = {
            bgColor: 'rgba(10, 22, 40, 1)',
            particleColor: 'rgba(0, 180, 255, 0.6)',
            particleRadius: 2,
            particleCount: 80,
            lineLength: 120,
            particleLife: 5
        };

        window.onresize = function() {
            w = canvas.width = window.innerWidth;
            h = canvas.height = window.innerHeight;
        };

        class Particle {
            constructor() {
                this.x = Math.random() * w;
                this.y = Math.random() * h;
                this.velocityX = (Math.random() - 0.5) * properties.particleLife * 0.2;
                this.velocityY = (Math.random() - 0.5) * properties.particleLife * 0.2;
            }
            position() {
                if (this.x + this.velocityX > w || this.x + this.velocityX < 0) this.velocityX *= -1;
                if (this.y + this.velocityY > h || this.y + this.velocityY < 0) this.velocityY *= -1;
                this.x += this.velocityX;
                this.y += this.velocityY;
            }
            reDraw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, properties.particleRadius, 0, Math.PI * 2);
                ctx.closePath();
                ctx.fillStyle = properties.particleColor;
                ctx.fill();
            }
        }

        function reDrawBackground() {
            ctx.fillStyle = properties.bgColor;
            ctx.fillRect(0, 0, w, h);
        }

        function drawLines() {
            for (var i = 0; i < particles.length; i++) {
                for (var j = i + 1; j < particles.length; j++) {
                    var dx = particles[i].x - particles[j].x;
                    var dy = particles[i].y - particles[j].y;
                    var length = Math.sqrt(dx * dx + dy * dy);
                    if (length < properties.lineLength) {
                        var opacity = (1 - length / properties.lineLength) * 0.5;
                        ctx.lineWidth = 0.5;
                        ctx.strokeStyle = 'rgba(0, 180, 255, ' + opacity + ')';
                        ctx.beginPath();
                        ctx.moveTo(particles[i].x, particles[i].y);
                        ctx.lineTo(particles[j].x, particles[j].y);
                        ctx.stroke();
                    }
                }
            }
        }

        function reDrawParticles() {
            for (var i in particles) {
                particles[i].position();
                particles[i].reDraw();
            }
        }

        function loop() {
            reDrawBackground();
            reDrawParticles();
            drawLines();
            requestAnimationFrame(loop);
        }

        function init() {
            for (var i = 0; i < properties.particleCount; i++) {
                particles.push(new Particle());
            }
            loop();
        }

        init();
    });
</script>
</body>
</html>
