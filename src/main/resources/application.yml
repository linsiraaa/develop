server:
  port: 8080

app:
  jwt:
    # 生产环境请通过 JWT_SECRET 注入长度至少 32 字节的随机密钥。
    secret: ${JWT_SECRET:traffic-dashboard-jwt-secret-change-in-production-2026}
    expiration-ms: ${JWT_EXPIRATION_MS:7200000}

spring:
  datasource:
    url: jdbc:mysql://hadoop102:3306/traffic_sql?useSSL=false&serverTimezone=UTC
    username: root
    password: 000000
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.MySQL8Dialect
  redis:
    host: hadoop102
    port: 6379
    database: 0
    timeout: 3000ms
  kafka:
    bootstrap-servers: hadoop102:9092
    consumer:
      group-id: traffic-realtime-group
      auto-offset-reset: latest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer



